<section id="quiz" class="section-card">
  <h2 class="text-2xl font-bold mb-4">🧠 DevOps Quiz</h2>
  <form id="devopsQuiz" class="space-y-4">
    <div>
      <p>1. What does CI stand for?</p>
      <label><input type="radio" name="q1" value="a" /> Continuous Integration</label><br />
      <label><input type="radio" name="q1" value="b" /> Constant Inspection</label>
    </div>

    <div>
      <p>2. Which tool is most commonly used for container orchestration?</p>
      <label><input type="radio" name="q2" value="a" /> Jenkins</label><br />
      <label><input type="radio" name="q2" value="b" /> Kubernetes</label>
    </div>

    <div>
      <p>3. What does YAML stand for?</p>
      <label><input type="radio" name="q3" value="a" /> Yet Another Markup Language</label><br />
      <label><input type="radio" name="q3" value="b" /> YAML Ain’t Markup Language</label>
    </div>

    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-800">Submit</button>
    <div id="quizResult" class="mt-4 font-semibold text-green-600"></div>
  </form>
</section>
