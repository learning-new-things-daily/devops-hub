<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Waving Hand -->
  <text x="100" y="70" font-size="48" text-anchor="middle" dominant-baseline="middle">
    👋
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      values="-15 100 70;15 100 70;-15 100 70"
                      dur="1s"
                      repeatCount="indefinite"/>
  </text>

  <!-- Loading Text -->
  <text x="100" y="120" font-size="18" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">
    Loading
    <tspan id="dot1">.</tspan>
    <tspan id="dot2">.</tspan>
    <tspan id="dot3">.</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0s" repeatCount="indefinite" />
  </text>
  
  <!-- Animated dots -->
  <circle cx="85" cy="125" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="125" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="125" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
