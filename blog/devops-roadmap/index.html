<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Roadmap Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Track your DevOps learning progress with this interactive roadmap tracker.">

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>
<body>
  <h1>📊 DevOps Learning Roadmap Tracker</h1>

  <div id="controls">
    <button id="pdfBtn" aria-label="Export progress as PDF">📄 Export Progress as PDF</button>
    <button id="backupBtn" aria-label="Download backup">💾 Download Backup</button>
    <label for="autoBackupToggle">
      <input type="checkbox" id="autoBackupToggle"> Auto Backup
    </label>
    <button id="importBtn" aria-label="Import backup">📂 Import Backup</button>
    <input type="file" id="importFile" accept=".zip" style="display:none">
    <button id="resetBtn" aria-label="Reset all progress" style="color:red;">🗑️ Reset Progress</button>
  </div>

  <div id="completion-tracker"></div>

  <div style="text-align:center;margin-bottom:15px;">
    <label for="pace-select">Learning Pace Multiplier:</label><br>
    <select id="pace-select">
      <option value="1">1x (Normal)</option>
      <option value="0.5">0.5x (Faster)</option>
      <option value="2">2x (Slower)</option>
    </select>
  </div>

  <canvas id="progress-donut" width="200" height="200"></canvas>

  <!-- Mindmap -->
  <div id="mindmap-container"></div>

  <!-- PWA Install Banner -->
  <div id="install-banner">
    Install this app? 
    <button id="install-btn">Install</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
