<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Roadmap Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <h1>📊 DevOps Learning Roadmap Tracker</h1>

  <div id="controls" style="margin-bottom:15px;">
    <button id="pdfBtn">📄 Export Progress as PDF</button>
    <button id="backupBtn">💾 Download Backup Now</button>
    <label style="margin-left:20px;">
      <input type="checkbox" id="autoBackupToggle"> Enable Auto Backup
    </label>
    
    <!-- Import Backup -->
    <button id="importBtn" style="margin-left:20px;">📂 Import Backup</button>
    <input type="file" id="importFile" accept=".zip" style="display:none">
  </div>

  <div id="completion-tracker" style="margin-bottom:15px;color:#fff;"></div>

  <label for="pace-select" style="color:#fff;">Learning Pace Multiplier:</label>
  <select id="pace-select">
    <option value="1">1x (Normal)</option>
    <option value="0.5">0.5x (Faster)</option>
    <option value="2">2x (Slower)</option>
  </select>

  <canvas id="progress-donut" width="200" height="200" style="margin:20px 0;"></canvas>

  <div id="mindmap-container"></div>

  <div id="install-banner" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:10px 20px;border-radius:10px;color:white;">
    Install this app? <button id="install-btn">Install</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
