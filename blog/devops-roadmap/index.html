<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Roadmap Tracker</title>

  <style>
    body {
      background-color: #0d1117;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      margin: 15px 0;
    }
    .node {
      cursor: pointer;
      padding: 6px 12px;
      margin: 4px 0;
      border-radius: 6px;
      background: #161b22;
      transition: 0.3s;
    }
    .node:hover {
      background: #1f2937;
    }
    .node.completed {
      background: #2e7d32;
    }
    .node.learning {
      background: #1e88e5;
    }
    .children {
      display: none;
      margin-left: 20px;
    }
    .children.visible {
      display: block;
    }
    textarea {
      font-size: 13px;
      padding: 4px;
      resize: vertical;
    }
    #mindmap-container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }
    #control-bar {
      text-align: center;
      margin: 15px 0;
    }
    button {
      margin: 5px;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #1e90ff;
      color: white;
    }
    button:hover {
      background: #1565c0;
    }
    #completion-tracker {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
    canvas {
      display: block;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>🚀 DevOps Roadmap Tracker</h1>

  <div id="control-bar">
    <button id="exportBtn">💾 Export Progress</button>
    <input type="file" id="importFile" accept=".json" style="display:none"/>
    <button id="importBtn">📂 Import Progress</button>
    <button id="pdfBtn">📄 Download PDF</button>
    <label style="margin-left:10px;">
      Pace:
      <select id="pace-select">
        <option value="1">1x</option>
        <option value="0.5">0.5x (faster)</option>
        <option value="2">2x (slower)</option>
      </select>
    </label>
  </div>

  <div id="completion-tracker"></div>
  <canvas id="progress-donut" width="220" height="220"></canvas>

  <div id="mindmap-container"></div>

  <!-- PWA Install Banner -->
  <div id="install-banner" style="display:none; justify-content:center; align-items:center; padding:10px; background:#222; color:white;">
    <span>📱 Install this app on your device</span>
    <button id="install-btn" style="margin-left:10px;">Install</button>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
