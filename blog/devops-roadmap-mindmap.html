<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Roadmap - Interactive Mindmap</title>
  <style>
    body { background:#0d1117; color:#fff; font-family:Arial; margin:0; }
    #top-bar {
      display:flex; align-items:center; padding:10px 20px; background:#161b22;
      position:sticky; top:0; z-index:1000;
    }
    #mindmap-container { padding:20px; }
    .node {
      display:inline-block; padding:6px 10px; margin:5px; border-radius:6px;
      background:#333; cursor:pointer; transition:0.2s;
    }
    .node.completed { background:#4CAF50; }
    .node.learning { background:#f1c40f; color:#000; }
    .children { display:none; margin-left:30px; }
    .children.visible { display:block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="top-bar">
  <button id="pdfBtn">Export PDF</button>

  <label for="pace-select" style="color:white;font-size:14px;margin-left:20px;">
    Learning Pace:
  </label>
  <select id="pace-select" style="margin-left:5px;">
    <option value="1">1 day per roadmap day (Default)</option>
    <option value="0.5">2 roadmap days per real day (Fast)</option>
    <option value="2">0.5 roadmap day per real day (Slow)</option>
  </select>

  <span id="completion-tracker" style="color:white;font-size:14px;margin-left:20px;">
    Estimated Completion: TBD
  </span>

  <canvas id="progress-donut" width="50" height="50" style="margin-left:20px;cursor:pointer;"></canvas>
</div>

<div id="mindmap-container"></div>

<script>
const roadmap = {
  "DevOps": {
    time: "0 days",
    children: {
      "Linux Basics": { time: "5 days" },
      "Git & Version Control": { time: "4 days" },
      "CI/CD Pipelines": { time: "7 days" },
      "Docker & Containers": { time: "7 days" },
      "Kubernetes": { time: "10 days" },
      "Cloud Platforms (AWS/Azure/GCP)": { time: "8 days" },
      "Monitoring & Logging": { time: "5 days" },
      "IaC (Terraform/Ansible)": { time: "6 days" }
    }
  }
};

let nodeStatus = JSON.parse(localStorage.getItem("nodeStatus") || "{}");

// === Build Mindmap ===
const container = document.getElementById("mindmap-container");

function buildTree(obj, parentKey="") {
  const div = document.createElement("div");
  for (const [key, val] of Object.entries(obj)) {
    const node = document.createElement("div");
    node.className = "node";
    node.dataset.key = key;
    node.textContent = key;

    const status = nodeStatus[key]?.state || "not-started";
    if(status==="completed") node.classList.add("completed");
    if(status==="learning") node.classList.add("learning");

    const childrenDiv = document.createElement("div");
    childrenDiv.className = "children";

    node.onclick = () => {
      childrenDiv.classList.toggle("visible");
      const current = nodeStatus[key]?.state || "not-started";
      const next = current==="not-started" ? "learning"
                : current==="learning" ? "completed" : "not-started";
      setStatus(key,next);
    };

    if(val.children) childrenDiv.appendChild(buildTree(val.children,key));
    div.appendChild(node);
    div.appendChild(childrenDiv);
  }
  return div;
}
container.appendChild(buildTree(roadmap));

// === Status Management ===
function setStatus(key,status){
  nodeStatus[key] = { state: status };
  if(status==="completed") nodeStatus[key].completedAt = new Date().toLocaleDateString();
  localStorage.setItem("nodeStatus",JSON.stringify(nodeStatus));
  const node = container.querySelector(`[data-key="${key}"]`);
  node.classList.remove("completed","learning");
  if(status==="completed") node.classList.add("completed");
  if(status==="learning") node.classList.add("learning");
}

// === Time Calculation ===
function parseDays(timeStr) {
  if (!timeStr) return 0;
  const match = timeStr.match(/(\d+)/);
  return match ? parseInt(match[1],10) : 0;
}
function calculateTime(node,keyPrefix="") {
  let results=[];
  const nodeKey=keyPrefix||Object.keys(roadmap)[0];
  const statusObj=nodeStatus[nodeKey]||{state:"not-started"};
  const time=parseDays(node.time);
  results.push({ key: nodeKey, state: statusObj.state, days: time });
  if(node.children){
    for(const [childKey,childNode] of Object.entries(node.children)){
      results=results.concat(calculateTime(childNode,childKey));
    }
  }
  return results;
}

// === Progress Tracker ===
function updateCompletionTracker() {
  const pace=parseFloat(document.getElementById("pace-select").value)||1;
  const allTimes=calculateTime(roadmap["DevOps"]);
  const totalDays=allTimes.reduce((s,n)=>s+n.days,0);
  const completedDays=allTimes.filter(n=>n.state==="completed").reduce((s,n)=>s+n.days,0);
  const remainingDays=totalDays-completedDays;
  const today=new Date();
  const completionDate=new Date(today);
  completionDate.setDate(today.getDate()+Math.ceil(remainingDays*pace));
  const completionDateStr=completionDate.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById("completion-tracker").textContent=
    `Estimated Completion: ${completionDateStr} (Remaining ${remainingDays} days)`;
}

// === Donut Chart ===
let donutChart;
let showRemainingDays=false;
function initDonutChart(){
  const ctx=document.getElementById('progress-donut').getContext('2d');
  const centerTextPlugin={
    id:'centerText',
    afterDraw(chart){
      const {ctx, chartArea:{width,height}}=chart;
      ctx.save();
      const total=chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
      const completed=chart.data.datasets[0].data[0];
      const percent=total>0?Math.round((completed/total)*100):0;
      const allTimes=calculateTime(roadmap["DevOps"]);
      const totalDays=allTimes.reduce((s,n)=>s+n.days,0);
      const completedDays=allTimes.filter(n=>n.state==="completed").reduce((s,n)=>s+n.days,0);
      const remainingDays=totalDays-completedDays;
      const text=showRemainingDays?`${remainingDays}d`:`${percent}%`;
      ctx.font='bold 14px Arial';
      ctx.fillStyle='#fff';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(text,width/2,height/2);
    }
  };
  donutChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels:['Completed','Remaining'],
      datasets:[{data:[0,100],backgroundColor:['#4CAF50','#333'],borderWidth:0}]},
    options:{
      cutout:'70%',
      plugins:{legend:{display:false},tooltip:{callbacks:{
        label:function(context){
          const label=context.label;
          const val=context.raw;
          return `${label}: ${val} topic(s)`;
        }
      }}},
      animation:{duration:300},
      onClick(){
        showRemainingDays=!showRemainingDays;
        donutChart.update();
      }
    },
    plugins:[centerTextPlugin]
  });
}
function updateDonutChart(){
  const nodes=container.querySelectorAll(".node");
  const total=nodes.length;
  const completed=Object.values(nodeStatus).filter(s=>s.state==="completed").length;
  const remaining=total-completed;
  donutChart.data.datasets[0].data=[completed,remaining];
  donutChart.update();
}

// === Hook events ===
document.getElementById("pace-select").addEventListener("change",updateCompletionTracker);
const originalSetStatus=setStatus;
setStatus=function(key,status){
  originalSetStatus(key,status);
  updateCompletionTracker();
  updateDonutChart();
};

// === Init ===
document.addEventListener("DOMContentLoaded",()=>{
  initDonutChart();
  updateDonutChart();
  updateCompletionTracker();
});
</script>
</body>
</html>
