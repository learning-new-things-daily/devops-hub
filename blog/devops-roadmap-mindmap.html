<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive DevOps Learning Roadmap</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
    }
    #mindmap-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #mindmap-container:active { cursor: grabbing; }
    #mindmap {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .node {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .node.not-started { background: #2f3136; color: #b9bbbe; }
    .node.learning { background: #f1c40f; color: black; }
    .node.completed { background: #2ecc71; color: black; }
    .node:hover { transform: scale(1.05); }
    line {
      stroke: #00c4ff;
      stroke-width: 2;
      stroke-linecap: round;
    }
    /* Tooltip/Modal */
    #tooltip {
      position: fixed;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 8px;
      display: none;
      z-index: 10;
      max-width: 250px;
      font-size: 14px;
    }
    #tooltip a { color: #00c4ff; text-decoration: none; }
    #tooltip a:hover { text-decoration: underline; }
    #tooltip button {
      margin-top: 5px;
      padding: 2px 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="mindmap-container">
  <svg id="lines"></svg>
  <div id="mindmap"></div>
</div>

<div id="tooltip"></div>

<script>
const roadmap = {
  "DevOps": {
    description: "Master DevOps by learning version control, CI/CD, cloud, containers, and automation.",
    time: "90 days",
    docs: "https://roadmap.sh/devops",
    tutorial: "https://www.youtube.com/watch?v=j5Zsa_eOXeY",
    children: {
      "Version Control": {
        description: "Manage source code and collaborate using Git.",
        time: "5 days",
        docs: "https://git-scm.com/doc",
        tutorial: "https://www.youtube.com/watch?v=USjZcfj8yxE",
        children: {
          "Git Basics": { description: "Learn commits, branches, merges.", time: "2 days", docs:"https://git-scm.com/book/en/v2", tutorial:"https://youtu.be/2ReR1YJrNOM" },
          "Branching Strategies": { description: "Understand Git Flow, trunk-based dev.", time: "1 day" },
          "GitHub/GitLab": { description: "Learn hosting repos and PRs.", time: "1 day", docs:"https://docs.github.com/en" },
        }
      },
      "CI/CD": {
        description: "Automate build and deployments.",
        time: "10 days",
        docs: "https://www.jenkins.io/doc/",
        tutorial: "https://youtu.be/FwfwWfkb6SY",
        children: {
          "Jenkins": { description:"Popular CI/CD tool", time:"3 days", docs:"https://www.jenkins.io/doc/" },
          "GitHub Actions": { description:"CI/CD via GitHub", time:"2 days", docs:"https://docs.github.com/en/actions" },
          "ArgoCD": { description:"GitOps deployment tool", time:"2 days", docs:"https://argo-cd.readthedocs.io/en/stable/" }
        }
      },
      "Containers": {
        description: "Learn containerization and orchestration.",
        time: "15 days",
        children: {
          "Docker": { description:"Package apps in containers.", time:"3 days", docs:"https://docs.docker.com/" },
          "Kubernetes": { description:"Orchestrate containers.", time:"7 days", docs:"https://kubernetes.io/docs/home/" },
          "Helm Charts": { description:"Manage K8s apps as packages.", time:"2 days", docs:"https://helm.sh/docs/" }
        }
      }
    }
  }
};

// --- DOM references ---
const container = document.getElementById("mindmap-container");
const mindmap = document.getElementById("mindmap");
const svg = document.getElementById("lines");
const tooltip = document.getElementById("tooltip");

let scale = 1, offsetX = 0, offsetY = 0;
let isDragging = false, startX, startY;

// --- PAN & ZOOM ---
function updateTransform() {
  mindmap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  svg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}
container.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
});
container.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  updateTransform();
});
container.addEventListener('mouseup', () => { isDragging = false; });
container.addEventListener('mouseleave', () => { isDragging = false; });
container.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 0.1;
  const mouseX = e.clientX, mouseY = e.clientY;
  const prevScale = scale;
  scale *= (e.deltaY<0) ? (1+zoomFactor):(1-zoomFactor);
  scale = Math.min(Math.max(scale,0.3),2);
  offsetX -= (mouseX-offsetX)*(scale/prevScale-1);
  offsetY -= (mouseY-offsetY)*(scale/prevScale-1);
  updateTransform();
});

// --- NODE CREATION ---
function createNode(key, info, x, y, parentKey=null) {
  const node = document.createElement("div");
  node.className = "node not-started";
  node.textContent = key;
  node.style.left = `${x}px`;
  node.style.top = `${y}px`;
  node.dataset.key = key;
  node.dataset.parent = parentKey || "";

  node.onclick = (e) => {
    e.stopPropagation();
    showTooltip(node, info, e.pageX, e.pageY);
  };
  mindmap.appendChild(node);
  return node;
}

function drawLine(x1,y1,x2,y2){
  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1); line.setAttribute("y1",y1);
  line.setAttribute("x2",x2); line.setAttribute("y2",y2);
  svg.appendChild(line);
  return line;
}

// --- Tooltip/Modal ---
function showTooltip(node, info, x, y) {
  tooltip.innerHTML = `
    <strong>${node.textContent}</strong><br/>
    ${info.description || "No description"}<br/>
    <small>Time: ${info.time || "N/A"}</small><br/>
    ${info.docs? `<a href="${info.docs}" target="_blank">Docs</a><br/>`:''}
    ${info.tutorial? `<a href="${info.tutorial}" target="_blank">Tutorial</a><br/>`:''}
    <button onclick="setStatus('${node.dataset.key}','learning')">Learning</button>
    <button onclick="setStatus('${node.dataset.key}','completed')">Completed</button>
  `;
  tooltip.style.display = 'block';
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function setStatus(key,status){
  const node = mindmap.querySelector(`.node[data-key='${key}']`);
  node.classList.remove("not-started","learning","completed");
  node.classList.add(status);
  tooltip.style.display='none';
}

// --- Auto-layout tree ---
function getSubtreeHeight(node){
  if(!node.children) return 1;
  let sum=0;
  for(let k in node.children){
    sum+=getSubtreeHeight(node.children[k]);
  }
  return sum;
}

function renderTree(key,data,x,y,parentCoords=null){
  const node=createNode(key,data,x,y,parentCoords?parentCoords.key:null);
  if(parentCoords){
    drawLine(parentCoords.x+50,parentCoords.y+15,x,y+15);
  }
  if(!data.children) return;

  const childKeys = Object.keys(data.children);
  let totalHeight = getSubtreeHeight(data) * 50;
  let currentY = y - totalHeight/2;

  childKeys.forEach(k=>{
    const childData = data.children[k];
    const childHeight = getSubtreeHeight(childData)*50;
    const childY = currentY+childHeight/2;
    renderTree(k,childData,x+220,childY,{x:x,y:y,key:key});
    currentY+=childHeight;
  });
}

// --- INIT ---
function init(){
  const rootX=100;
  const rootY=window.innerHeight/2;
  renderTree("DevOps",roadmap["DevOps"],rootX,rootY);
}
init();
updateTransform();
</script>

</body>
</html>
