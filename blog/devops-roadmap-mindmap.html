<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Roadmap - Galaxy Mindmap</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
    }

    #mindmap-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    #mindmap-container:active {
      cursor: grabbing;
    }

    #mindmap {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }

    svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .node {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.3s;
      white-space: nowrap;
      opacity: 0;
      transform: scale(0);
    }

    .node.show {
      opacity: 1;
      transform: scale(1);
    }

    .node:hover {
      background: #21262d;
      transform: scale(1.1);
    }

    line {
      stroke: #00c4ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawLine 1s forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

<div id="mindmap-container">
  <svg id="lines"></svg>
  <div id="mindmap"></div>
</div>

<script>
const roadmap = {
  "DevOps": {
    "Version Control": ["Git", "GitHub/GitLab/Bitbucket"],
    "CI/CD": ["Jenkins", "GitHub Actions", "GitLab CI/CD", "BuildPiper"],
    "Infrastructure": {
      "Cloud Providers": ["AWS", "Azure", "GCP"],
      "IaC": ["Terraform", "CloudFormation", "Pulumi"]
    },
    "Containers & Orchestration": ["Docker", "Kubernetes", "Helm"],
    "Monitoring & Logging": ["Prometheus & Grafana", "ELK/EFK Stack", "Datadog"],
    "Security & DevSecOps": ["Snyk", "Trivy", "HashiCorp Vault"]
  }
};

const container = document.getElementById("mindmap-container");
const mindmap = document.getElementById("mindmap");
const svg = document.getElementById("lines");

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let startX, startY;
let velocityX = 0, velocityY = 0;
let lastMoveTime = 0;
let lastMouseX = 0, lastMouseY = 0;
let inertiaFrame;

// Orbiting nodes storage
let orbitingNodes = [];

// --- PAN & ZOOM WITH INERTIA ---
function updateTransform() {
  mindmap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  svg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

container.addEventListener('mousedown', e => {
  isDragging = true;
  cancelAnimationFrame(inertiaFrame);
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  lastMoveTime = Date.now();
});

container.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;

  const now = Date.now();
  const deltaTime = now - lastMoveTime;
  velocityX = (e.clientX - lastMouseX) / deltaTime * 16;
  velocityY = (e.clientY - lastMouseY) / deltaTime * 16;
  lastMoveTime = now;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;

  updateTransform();
});

function startInertia() {
  function step() {
    offsetX += velocityX;
    offsetY += velocityY;
    velocityX *= 0.95;
    velocityY *= 0.95;
    updateTransform();

    if (Math.abs(velocityX) > 0.1 || Math.abs(velocityY) > 0.1) {
      inertiaFrame = requestAnimationFrame(step);
    }
  }
  inertiaFrame = requestAnimationFrame(step);
}

container.addEventListener('mouseup', () => {
  isDragging = false;
  startInertia();
});

container.addEventListener('mouseleave', () => {
  if (isDragging) {
    isDragging = false;
    startInertia();
  }
});

// Zoom
container.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 0.1;
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  const prevScale = scale;
  if (e.deltaY < 0) scale *= 1 + zoomFactor;
  else scale *= 1 - zoomFactor;
  scale = Math.min(Math.max(scale, 0.2), 3);

  // Zoom towards mouse pointer
  offsetX -= (mouseX - offsetX) * (scale / prevScale - 1);
  offsetY -= (mouseY - offsetY) * (scale / prevScale - 1);

  updateTransform();
});

// --- NODE CREATION & LINES ---
function createNode(text, x, y) {
  const div = document.createElement("div");
  div.className = "node";
  div.textContent = text;
  div.style.left = `${x}px`;
  div.style.top = `${y}px`;
  mindmap.appendChild(div);
  setTimeout(() => div.classList.add("show"), 50);
  return div;
}

function drawLine(x1, y1, x2, y2) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  svg.appendChild(line);
  return line;
}

// --- EXPANSION WITH DEPTH-BASED ORBIT ---
function toggleExpand(node, children, depth = 1) {
  if (!node.dataset.expanded) {
    node.dataset.expanded = "true";
    const rect = node.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2 - container.offsetLeft;
    const centerY = rect.top + rect.height / 2 - container.offsetTop;

    const count = Object.keys(children).length;
    const radius = 150 + depth * 30;
    let i = 0;

    for (const key in children) {
      const angle = (i / count) * 2 * Math.PI;
      const x = centerX + radius * Math.cos(angle);
      const y = centerY + radius * Math.sin(angle);

      const childNode = createNode(key, x, y);
      const line = drawLine(centerX, centerY, x + 40, y + 20);

      // Orbit speed depends on depth (outer = faster)
      orbitingNodes.push({
        element: childNode,
        line: line,
        parentX: centerX,
        parentY: centerY,
        angle: angle,
        radius: radius,
        speed: 0.002 * depth + Math.random() * 0.002
      });

      childNode.onclick = () => {
        if (Array.isArray(children[key])) {
          expandArray(childNode, children[key], depth + 1);
        } else {
          toggleExpand(childNode, children[key], depth + 1);
        }
      };
      i++;
    }
  }
}

function expandArray(node, arr, depth = 1) {
  if (node.dataset.expanded) return;
  node.dataset.expanded = "true";

  const rect = node.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2 - container.offsetLeft;
  const centerY = rect.top + rect.height / 2 - container.offsetTop;
  const radius = 100 + depth * 30;
  const count = arr.length;

  arr.forEach((item, i) => {
    const angle = (i / count) * 2 * Math.PI;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle);
    const childNode = createNode(item, x, y);
    const line = drawLine(centerX, centerY, x + 40, y + 20);

    orbitingNodes.push({
      element: childNode,
      line: line,
      parentX: centerX,
      parentY: centerY,
      angle: angle,
      radius: radius,
      speed: 0.002 * depth + Math.random() * 0.002
    });
  });
}

// Orbit animation
function animateOrbit() {
  orbitingNodes.forEach(n => {
    n.angle += n.speed;
    const x = n.parentX + n.radius * Math.cos(n.angle);
    const y = n.parentY + n.radius * Math.sin(n.angle);
    n.element.style.left = `${x}px`;
    n.element.style.top = `${y}px`;
    n.line.setAttribute("x2", x + 40);
    n.line.setAttribute("y2", y + 20);
  });
  requestAnimationFrame(animateOrbit);
}

// --- INIT ---
function initMindmap() {
  const centerX = window.innerWidth / 2 - 50;
  const centerY = window.innerHeight / 2 - 20;
  const root = createNode("DevOps", centerX, centerY);
  root.onclick = () => toggleExpand(root, roadmap["DevOps"], 1);
}

initMindmap();
updateTransform();
animateOrbit();
</script>

</body>
</html>
