<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Tree Roadmap</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
    }
    #mindmap-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #mindmap-container:active { cursor: grabbing; }
    #mindmap {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .node {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s;
      white-space: nowrap;
    }
    .node:hover { background: #21262d; transform: scale(1.05); }
    line {
      stroke: #00c4ff;
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>
</head>
<body>

<div id="mindmap-container">
  <svg id="lines"></svg>
  <div id="mindmap"></div>
</div>

<script>
const roadmap = {
  "DevOps": {
    "Version Control": [
      "Git Basics",
      "Branching Strategies",
      "GitHub/GitLab/Bitbucket",
      "Git Hooks & Git Flow"
    ],
    "CI/CD": [
      "Jenkins",
      "GitHub Actions",
      "GitLab CI/CD",
      "BuildPiper",
      "CircleCI / Argo Workflows",
      "Canary & Blue/Green Deployments"
    ],
    "Infrastructure": {
      "Cloud Providers": {
        "AWS": ["EC2","S3","IAM","Lambda"],
        "Azure": ["VM","Blob Storage","Functions"],
        "GCP": ["Compute Engine","Cloud Storage","Cloud Functions"]
      },
      "IaC": ["Terraform","CloudFormation","Pulumi","Ansible (Infra)"]
    },
    "Containers & Orchestration": [
      "Docker",
      "Kubernetes (Pods, Services, Ingress, CRDs)",
      "Helm Charts",
      "OpenShift / Rancher",
      "Container Security (Trivy, Falco)"
    ],
    "Monitoring & Logging": [
      "Prometheus & Grafana",
      "ELK/EFK Stack",
      "Datadog",
      "New Relic",
      "Jaeger / OpenTelemetry"
    ],
    "Security & DevSecOps": [
      "Snyk",
      "Trivy",
      "HashiCorp Vault",
      "SonarQube",
      "OWASP ZAP",
      "Secret Scanning (Gitleaks)"
    ],
    "Automation & Scripting": [
      "Python (Automation)",
      "Bash / Shell",
      "PowerShell (Windows)",
      "Cron Jobs / Schedulers"
    ],
    "Collaboration & Project Management": [
      "Jira / Azure DevOps Boards",
      "Confluence / Documentation",
      "ChatOps (Slack, Teams)"
    ],
    "Observability & Incident Response": [
      "Alertmanager",
      "PagerDuty / OpsGenie",
      "ServiceNow ITSM",
      "SLOs / SLIs / SLAs"
    ]
  }
};

const container = document.getElementById("mindmap-container");
const mindmap = document.getElementById("mindmap");
const svg = document.getElementById("lines");

let scale = 1, offsetX = 0, offsetY = 0;
let isDragging = false, startX, startY;
let velocityX = 0, velocityY = 0;
let lastMoveTime = 0, lastMouseX = 0, lastMouseY = 0;
let inertiaFrame;

// --- PAN & ZOOM ---
function updateTransform() {
  mindmap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  svg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

container.addEventListener('mousedown', e => {
  isDragging = true;
  cancelAnimationFrame(inertiaFrame);
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  lastMoveTime = Date.now();
});
container.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  const now = Date.now();
  const deltaTime = now - lastMoveTime;
  velocityX = (e.clientX - lastMouseX) / deltaTime * 16;
  velocityY = (e.clientY - lastMouseY) / deltaTime * 16;
  lastMoveTime = now;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  updateTransform();
});
function startInertia() {
  function step() {
    offsetX += velocityX;
    offsetY += velocityY;
    velocityX *= 0.95; velocityY *= 0.95;
    updateTransform();
    if (Math.abs(velocityX) > 0.1 || Math.abs(velocityY) > 0.1)
      inertiaFrame = requestAnimationFrame(step);
  }
  inertiaFrame = requestAnimationFrame(step);
}
container.addEventListener('mouseup', () => { isDragging = false; startInertia(); });
container.addEventListener('mouseleave', () => { if (isDragging){isDragging=false; startInertia();} });
container.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 0.1;
  const mouseX = e.clientX, mouseY = e.clientY;
  const prevScale = scale;
  scale *= (e.deltaY<0) ? (1+zoomFactor):(1-zoomFactor);
  scale = Math.min(Math.max(scale,0.2),3);
  offsetX -= (mouseX-offsetX)*(scale/prevScale-1);
  offsetY -= (mouseY-offsetY)*(scale/prevScale-1);
  updateTransform();
});

// --- NODE CREATION & LINES ---
function createNode(text,x,y){
  const div=document.createElement("div");
  div.className="node";
  div.textContent=text;
  div.style.left=`${x}px`;
  div.style.top=`${y}px`;
  mindmap.appendChild(div);
  return div;
}
function drawLine(x1,y1,x2,y2){
  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1); line.setAttribute("y1",y1);
  line.setAttribute("x2",x2); line.setAttribute("y2",y2);
  svg.appendChild(line); return line;
}

// --- EXPAND/COLLAPSE TREE ---
function toggleExpand(node, children, depth=0){
  if(node.dataset.expanded){
    // collapse
    node.dataset.expanded = "";
    const childNodes = document.querySelectorAll(`[data-parent='${node.textContent}']`);
    childNodes.forEach(n=>{
      toggleExpand(n,{},depth+1); // recursively collapse
      mindmap.removeChild(n);
    });
    // remove lines
    document.querySelectorAll(`line[data-parent='${node.textContent}']`).forEach(l=>l.remove());
    return;
  }

  node.dataset.expanded = "true";
  const rect=node.getBoundingClientRect();
  const startX=rect.left+rect.width/2-container.offsetLeft;
  const startY=rect.top+rect.height-container.offsetTop;
  const gapY = 50;
  const gapX = 180;

  const keys = Array.isArray(children)? children : Object.keys(children);
  keys.forEach((key,i)=>{
    const x=startX+gapX;
    const y=startY+i*(gapY+30)+gapY;
    const childNode=createNode(key,x,y);
    childNode.dataset.parent=node.textContent;
    const line=drawLine(startX, startY, x, y+15);
    line.dataset.parent=node.textContent;

    childNode.onclick=()=>{
      if(Array.isArray(children[key])) toggleExpand(childNode, children[key], depth+1);
      else if(typeof children[key]==="object") toggleExpand(childNode, children[key], depth+1);
    };
  });
}

// --- INIT ---
function initMindmap(){
  const centerX=100;
  const centerY=window.innerHeight/2-20;
  const root=createNode("DevOps",centerX,centerY);
  root.onclick=()=>toggleExpand(root,roadmap["DevOps"],0);
}
initMindmap(); updateTransform();
</script>

</body>
</html>
