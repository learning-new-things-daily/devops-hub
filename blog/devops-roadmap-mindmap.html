<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Hierarchical Roadmap</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
    }
    #mindmap-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #mindmap-container:active { cursor: grabbing; }
    #mindmap {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .node {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s;
      white-space: nowrap;
    }
    .node:hover { background: #21262d; transform: scale(1.05); }
    line {
      stroke: #00c4ff;
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>
</head>
<body>

<div id="mindmap-container">
  <svg id="lines"></svg>
  <div id="mindmap"></div>
</div>

<script>
const roadmap = {
  "DevOps": {
    "Version Control": [
      "Git Basics",
      "Branching Strategies",
      "GitHub/GitLab/Bitbucket",
      "Git Hooks & Git Flow"
    ],
    "CI/CD": [
      "Jenkins",
      "GitHub Actions",
      "GitLab CI/CD",
      "BuildPiper",
      "CircleCI / Argo Workflows",
      "Canary & Blue/Green Deployments"
    ],
    "Infrastructure": {
      "Cloud Providers": {
        "AWS": ["EC2","S3","IAM","Lambda"],
        "Azure": ["VM","Blob Storage","Functions"],
        "GCP": ["Compute Engine","Cloud Storage","Cloud Functions"]
      },
      "IaC": ["Terraform","CloudFormation","Pulumi","Ansible (Infra)"]
    },
    "Containers & Orchestration": [
      "Docker",
      "Kubernetes (Pods, Services, Ingress, CRDs)",
      "Helm Charts",
      "OpenShift / Rancher",
      "Container Security (Trivy, Falco)"
    ],
    "Monitoring & Logging": [
      "Prometheus & Grafana",
      "ELK/EFK Stack",
      "Datadog",
      "New Relic",
      "Jaeger / OpenTelemetry"
    ],
    "Security & DevSecOps": [
      "Snyk",
      "Trivy",
      "HashiCorp Vault",
      "SonarQube",
      "OWASP ZAP",
      "Secret Scanning (Gitleaks)"
    ],
    "Automation & Scripting": [
      "Python (Automation)",
      "Bash / Shell",
      "PowerShell (Windows)",
      "Cron Jobs / Schedulers"
    ],
    "Collaboration & Project Management": [
      "Jira / Azure DevOps Boards",
      "Confluence / Documentation",
      "ChatOps (Slack, Teams)"
    ],
    "Observability & Incident Response": [
      "Alertmanager",
      "PagerDuty / OpsGenie",
      "ServiceNow ITSM",
      "SLOs / SLIs / SLAs"
    ]
  }
};

const container = document.getElementById("mindmap-container");
const mindmap = document.getElementById("mindmap");
const svg = document.getElementById("lines");

let scale = 1, offsetX = 0, offsetY = 0;
let isDragging = false, startX, startY;
let velocityX = 0, velocityY = 0;
let lastMoveTime = 0, lastMouseX = 0, lastMouseY = 0;
let inertiaFrame;

// --- PAN & ZOOM ---
function updateTransform() {
  mindmap.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  svg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}
container.addEventListener('mousedown', e => {
  isDragging = true;
  cancelAnimationFrame(inertiaFrame);
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  lastMoveTime = Date.now();
});
container.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  const now = Date.now();
  const deltaTime = now - lastMoveTime;
  velocityX = (e.clientX - lastMouseX) / deltaTime * 16;
  velocityY = (e.clientY - lastMouseY) / deltaTime * 16;
  lastMoveTime = now;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  updateTransform();
});
function startInertia() {
  function step() {
    offsetX += velocityX;
    offsetY += velocityY;
    velocityX *= 0.95; velocityY *= 0.95;
    updateTransform();
    if (Math.abs(velocityX) > 0.1 || Math.abs(velocityY) > 0.1)
      inertiaFrame = requestAnimationFrame(step);
  }
  inertiaFrame = requestAnimationFrame(step);
}
container.addEventListener('mouseup', () => { isDragging = false; startInertia(); });
container.addEventListener('mouseleave', () => { if (isDragging){isDragging=false; startInertia();} });
container.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 0.1;
  const mouseX = e.clientX, mouseY = e.clientY;
  const prevScale = scale;
  scale *= (e.deltaY<0) ? (1+zoomFactor):(1-zoomFactor);
  scale = Math.min(Math.max(scale,0.2),3);
  offsetX -= (mouseX-offsetX)*(scale/prevScale-1);
  offsetY -= (mouseY-offsetY)*(scale/prevScale-1);
  updateTransform();
});

// --- TREE LAYOUT ---
function createNode(text,x,y){
  const div=document.createElement("div");
  div.className="node";
  div.textContent=text;
  div.style.left=`${x}px`;
  div.style.top=`${y}px`;
  mindmap.appendChild(div);
  return div;
}
function drawLine(x1,y1,x2,y2){
  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1); line.setAttribute("y1",y1);
  line.setAttribute("x2",x2); line.setAttribute("y2",y2);
  svg.appendChild(line);
  return line;
}

// Compute layout sizes
function getSubtreeHeight(children) {
  if (Array.isArray(children)) return children.length;
  let sum = 0;
  for (const key in children) {
    const c = children[key];
    sum += getSubtreeHeight(c);
  }
  return Math.max(sum, 1);
}

function renderTree(nodeText, data, x, y, depth=0, parentCoords=null) {
  const node=createNode(nodeText, x, y);
  const nodeHeight = 30;
  const nodeGapY = 50;
  const nodeGapX = 220;

  if (parentCoords) {
    drawLine(parentCoords.x + 50, parentCoords.y + 15, x, y + 15);
  }

  node.onclick = () => {
    // Toggle collapse
    const isExpanded = node.dataset.expanded==="true";
    if(isExpanded){
      collapseSubtree(nodeText);
      node.dataset.expanded="false";
    } else {
      node.dataset.expanded="true";
      renderChildren(node, data, x, y, depth+1);
    }
  };
  return node;
}

function renderChildren(node, data, x, y, depth) {
  const children = Array.isArray(data)? data : Object.keys(data);
  let totalHeight = getSubtreeHeight(data) * 40;
  let currentY = y - totalHeight/2;
  
  children.forEach(key=>{
    const childData = Array.isArray(data)? null : data[key];
    const childHeight = getSubtreeHeight(childData||key) * 40;
    const childY = currentY + childHeight/2;
    const childX = x + 220;
    renderTree(key, childData||[], childX, childY, depth, {x:x,y:y});
    currentY += childHeight;
  });
}

function collapseSubtree(name){
  const nodes = [...mindmap.querySelectorAll(".node")];
  nodes.forEach(n=>{
    if(n.dataset.parent === name){
      collapseSubtree(n.textContent);
      n.remove();
    }
  });
  [...svg.querySelectorAll("line")].forEach(line=>{
    if(line.dataset.parent===name) line.remove();
  });
}

// --- INIT ---
function initMindmap(){
  const rootX=100;
  const rootY=window.innerHeight/2;
  renderTree("DevOps", roadmap["DevOps"], rootX, rootY);
}
initMindmap();
updateTransform();
</script>

</body>
</html>
