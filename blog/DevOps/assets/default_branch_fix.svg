<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"
     style="background:#f4faff; font-family:Segoe UI, sans-serif">
  <!-- Background title -->
  <text x="50%" y="60" font-size="24" font-weight="bold" text-anchor="middle" fill="#003c58">
    Changing the Default Branch in GitHub
  </text>

  <!-- Branch icons -->
  <g>
    <circle cx="200" cy="160" r="30" fill="#90caf9"/>
    <text x="200" y="165" text-anchor="middle" font-size="14" fill="#fff">test/dev</text>

    <circle cx="600" cy="160" r="30" fill="#66bb6a"/>
    <text x="600" y="165" text-anchor="middle" font-size="14" fill="#fff">main</text>
  </g>

  <!-- Arrow between branches -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0288d1"/>
    </marker>
  </defs>
  <line x1="230" y1="160" x2="570" y2="160"
        stroke="#0288d1" stroke-width="3"
        marker-end="url(#arrowhead)"/>

  <!-- Label below -->
  <text x="400" y="230" font-size="16" fill="#555" text-anchor="middle">
    Using GitHub CLI to change default branch from test/dev to main
  </text>
</svg>
