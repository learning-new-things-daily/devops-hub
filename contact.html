<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - DevOps Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 text-gray-800 p-6 max-w-xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">Contact Me</h1>
  <p class="mb-6">Looking to hire or collaborate? Fill the form below or email me directly.</p>

  <form action="https://formspree.io/f/your_form_id" method="POST" class="space-y-4">
    <input type="text" name="name" placeholder="Your name" required class="w-full p-2 border rounded"/>
    <input type="email" name="email" placeholder="Your email" required class="w-full p-2 border rounded"/>
    <textarea name="message" placeholder="Your message" required class="w-full p-2 border rounded"></textarea>
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Send</button>
  </form>

  <p class="mt-4">📧 Or email: <a href="mailto:mukuljoshi50@gmail.com" class="text-blue-600">mukuljoshi50@gmail.com</a></p>
  <a href="/index.html" class="mt-4 block text-blue-600 hover:underline">← Back to Home</a>
</body>
</html>
